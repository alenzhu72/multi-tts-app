<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SRT 多角色系统配音助手</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="项目设置">
        <div>
          <p class="eyebrow">Local SRT Voice Casting</p>
          <h1>SRT 多角色系统配音助手</h1>
        </div>
        <div class="top-actions">
          <button id="sampleBtn" class="ghost" type="button">载入示例</button>
          <button id="analyzeBtn" class="primary" type="button">智能识别</button>
        </div>
      </section>

      <section class="workspace">
        <aside class="source-panel" aria-label="SRT 输入">
          <label class="drop-zone" for="fileInput" id="dropZone">
            <input id="fileInput" type="file" accept=".srt,text/plain" />
            <span class="drop-title">导入 SRT</span>
            <span class="drop-subtitle">点击选择文件，或直接拖拽到这里</span>
          </label>

          <label class="textarea-label" for="srtInput">SRT 内容</label>
          <textarea id="srtInput" spellcheck="false" placeholder="粘贴 SRT 字幕内容..."></textarea>

          <div class="settings-grid">
            <label>
              字幕语言
              <select id="languageSelect">
                <option value="">自动/全部声音</option>
                <option value="zh">中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
              </select>
            </label>
            <label>
              自动人数
              <select id="speakerCount">
                <option value="auto">自动判断</option>
                <option value="2">2 人</option>
                <option value="3">3 人</option>
                <option value="4">4 人</option>
                <option value="5">5 人</option>
                <option value="6">6 人</option>
                <option value="7">7 人</option>
                <option value="8">8 人</option>
              </select>
            </label>
            <label>
              需要声音数
              <select id="roleCount">
                <option value="2">A, B</option>
                <option value="3" selected>A, B, C</option>
                <option value="4">A, B, C, D</option>
                <option value="5">A, B, C, D, E</option>
                <option value="6">A, B, C, D, E, F</option>
              </select>
            </label>
          </div>

          <p class="hint">
            已有 [speaker1]、[spk2] 或 “人物名：台词” 会优先识别；没有标记时使用台词轮换和文本特征初分。
          </p>
        </aside>

        <section class="main-panel" aria-label="角色分配">
          <div class="status-strip">
            <div>
              <strong id="lineCount">0</strong>
              <span>字幕行</span>
            </div>
            <div>
              <strong id="detectedCount">0</strong>
              <span>识别人物</span>
            </div>
            <div>
              <strong id="voiceCount">0</strong>
              <span>系统声音</span>
            </div>
          </div>

          <div class="section-head">
            <div>
              <h2>人物与声音</h2>
              <p>把系统识别出的人合并到你真正需要的声音角色。</p>
            </div>
            <button id="previewRolesBtn" class="ghost" type="button">试听角色</button>
          </div>
          <div id="speakerCards" class="speaker-cards"></div>

          <div class="section-head table-head">
            <div>
              <h2>字幕逐句校正</h2>
              <p>可以改说话人、改合并角色，也可以直接编辑文本。</p>
            </div>
            <div class="table-actions">
              <button id="playAllBtn" class="ghost" type="button">播放选中</button>
              <button id="exportAudioBtn" class="ghost" type="button">导出 WAV 包</button>
              <button id="exportSrtBtn" class="primary" type="button">导出标记 SRT</button>
              <button id="exportJsonBtn" class="ghost" type="button">导出配置</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th><input id="selectAll" type="checkbox" checked /></th>
                  <th>行</th>
                  <th>时间轴</th>
                  <th>识别人物</th>
                  <th>声音角色</th>
                  <th>Text</th>
                  <th>试听</th>
                </tr>
              </thead>
              <tbody id="subtitleBody">
                <tr class="empty-row">
                  <td colspan="7">导入或粘贴 SRT 后点击“智能识别”。</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
